[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/publication/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    Content-Disposition = "attachment"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
